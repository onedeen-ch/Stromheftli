name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Android-Projekt vorbereiten
        run: bash tool/android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: cp build/app/outputs/flutter-apk/app-debug.apk Stromheftli.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stromheftli-APK
          path: Stromheftli.apk
          if-no-files-found: error
