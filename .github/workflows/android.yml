name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Android-Projekt vorbereiten
        run: bash tool/android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: cp build/app/outputs/flutter-apk/app-debug.apk Stromheftli.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stromheftli-APK
          path: Stromheftli.apk
          if-no-files-found: error

  device:
    name: Offline-Test auf Android
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stromheftli-APK
      - name: KVM-Zugriff für den Emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: default
          profile: pixel_3a
          disable-animations: true
          script: |
            adb install -r Stromheftli.apk
            python3 tool/device_test.py
